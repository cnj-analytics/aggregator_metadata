name: Careem UAE – Sync Areas (active-status probe)
run-name: Careem sync-areas – ${{ inputs.test_city_id == '' && 'all UAE' || format('talabat city_id={0}', inputs.test_city_id) }}

# Probes every Talabat UAE area against Careem's listings endpoint and marks
# careem_area.is_active (and rolls up careem_city.is_active) from whether the
# response contains any restaurants.
#
# Steps the job runs:
#   1. Pulls the latest Careem guest token from Supabase (careem_token_latest() RPC)
#   2. Seeds careem_city from the hard-coded Talabat->Careem city map
#   3. Reads every talabat_area row (497 UAE areas)
#   4. Fires one listings request per area centroid at concurrency `max_concurrent`
#   5. Upserts careem_area with is_active + restaurant_count + last_probed_at
#   6. Recomputes careem_city.is_active from the fresh area rows
#
# Depends on the token in public.careem_auth_token being valid at run time —
# a Careem guest token is 16-24h, so launch this manually inside that window.

on:
  workflow_dispatch:
    inputs:
      test_city_id:
        description: 'Optional: Talabat city_id to probe only (empty = all UAE). 35 Dubai, 43 Abu Dhabi, 44 Sharjah, 48 RAK, 49 Al Ain, 50 Ajman, 96 Fujairah, 125 UAQ.'
        type: string
        default: ''
      max_concurrent:
        description: 'Parallel Careem requests'
        type: string
        default: '5'
      batch_delay_ms:
        description: 'Delay (ms) between batches'
        type: string
        default: '150'
      min_restaurants:
        description: 'Restaurants required for an area to be active'
        type: string
        default: '1'

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Careem sync-areas
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CAREEM_MAX_CONCURRENT: ${{ inputs.max_concurrent }}
          CAREEM_BATCH_DELAY_MS: ${{ inputs.batch_delay_ms }}
          CAREEM_MIN_RESTAURANTS: ${{ inputs.min_restaurants }}
          TEST_MODE: ${{ inputs.test_city_id != '' }}
          TEST_CITY_ID: ${{ inputs.test_city_id }}
        run: |
          set -euo pipefail
          node careem/uae/sync-areas.js | tee run.log

      - name: Build job summary
        if: always()
        run: |
          set +e
          {
            echo "## Careem sync-areas"
            echo
            if [ -n "${{ inputs.test_city_id }}" ]; then
              echo "Scope: Talabat city_id=${{ inputs.test_city_id }}"
            else
              echo "Scope: all UAE (every talabat_area row)"
            fi
            echo
            echo "### Run log (tail)"
            echo '```'
            tail -120 run.log 2>/dev/null || echo '(no log)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: careem-sync-areas-${{ github.run_id }}
          path: run.log
          if-no-files-found: warn
          retention-days: 7
