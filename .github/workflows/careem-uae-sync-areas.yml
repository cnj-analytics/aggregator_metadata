name: Careem UAE – Sync Areas (active-status probe)
run-name: Careem sync-areas – ${{ inputs.test_city_id == '' && (inputs.only_errored == 'true' && 'retry errored' || 'all UAE') || format('talabat city_id={0}', inputs.test_city_id) }}

# Probes every Talabat UAE area against Careem's listings endpoint and marks
# careem_area.is_active (and rolls up careem_city.is_active) from whether the
# response contains any restaurants.
#
# Clean-run guarantees in sync-areas.js:
#   * Serial by default (concurrency 1, 400ms delay) so Careem's rate limiter
#     is never hit.
#   * On HTTP 429, pauses globally 30s then retries up to 4 attempts.
#   * A failed probe NEVER demotes a previously-active area to inactive.
#     The probe_error column is set so operators can see which rows need
#     re-probing; is_active and restaurant_count are left untouched.
#   * If any probe still fails after retries, the job exits non-zero (red).
#     Re-run with only_errored=true to retry just those areas idempotently.
#
# Depends on the token in public.careem_auth_token being valid at run time —
# a Careem guest token is 16-24h, so launch this manually inside that window.

on:
  workflow_dispatch:
    inputs:
      test_city_id:
        description: 'Optional: Talabat city_id to probe only (empty = all UAE). 35 Dubai, 43 Abu Dhabi, 44 Sharjah, 48 RAK, 49 Al Ain, 50 Ajman, 96 Fujairah, 125 UAQ.'
        type: string
        default: ''
      only_errored:
        description: 'Retry only areas with probe_error set or restaurant_count NULL'
        type: choice
        options: ['false', 'true']
        default: 'false'
      max_concurrent:
        description: 'Parallel Careem requests (keep at 1 for a clean run)'
        type: string
        default: '1'
      batch_delay_ms:
        description: 'Delay (ms) between probes'
        type: string
        default: '400'
      probe_retries:
        description: 'Attempts per probe before giving up'
        type: string
        default: '4'
      rate_limit_pause_ms:
        description: 'Global pause (ms) after a 429'
        type: string
        default: '30000'
      min_restaurants:
        description: 'Restaurants required for an area to be active'
        type: string
        default: '1'

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Careem sync-areas
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CAREEM_MAX_CONCURRENT: ${{ inputs.max_concurrent }}
          CAREEM_BATCH_DELAY_MS: ${{ inputs.batch_delay_ms }}
          CAREEM_MIN_RESTAURANTS: ${{ inputs.min_restaurants }}
          CAREEM_PROBE_RETRIES: ${{ inputs.probe_retries }}
          CAREEM_RATE_LIMIT_PAUSE_MS: ${{ inputs.rate_limit_pause_ms }}
          CAREEM_ONLY_ERRORED: ${{ inputs.only_errored }}
          TEST_MODE: ${{ inputs.test_city_id != '' }}
          TEST_CITY_ID: ${{ inputs.test_city_id }}
        run: |
          set -euo pipefail
          # Capture stderr too so the job summary tail shows real errors.
          node careem/uae/sync-areas.js 2>&1 | tee run.log

      - name: Build job summary
        if: always()
        run: |
          set +e
          {
            echo "## Careem sync-areas"
            echo
            if [ -n "${{ inputs.test_city_id }}" ]; then
              echo "Scope: Talabat city_id=${{ inputs.test_city_id }}"
            elif [ "${{ inputs.only_errored }}" = "true" ]; then
              echo "Scope: only previously-errored areas"
            else
              echo "Scope: all UAE (every talabat_area row)"
            fi
            echo
            echo "### Run log (tail)"
            echo '```'
            tail -200 run.log 2>/dev/null || echo '(no log)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: careem-sync-areas-${{ github.run_id }}
          path: run.log
          if-no-files-found: warn
          retention-days: 7
