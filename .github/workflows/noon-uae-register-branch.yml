name: Noon UAE – Register Branch

# Started by Supabase (noon_dispatch_registration trigger) when the ranking
# scrape finds outlet codes that are not in noon_branch. Can also be run by hand.
#
# Model: ONE machine operating at a time, and each machine registers at most
# CALL_BUDGET outlets before exiting. When the machine finishes, the report
# job calls noon_registration_run_completed (reopens the trigger-gate) and
# then noon_registration_try_dispatch (the SAME gated RPC the ranking-scrape
# trigger uses) to request the next machine. Routing both paths through one
# gated dispatcher prevents the Supabase trigger and the self-dispatch from
# racing and spawning duplicate workflow runs on the same tick.
on:
  workflow_dispatch:

concurrency:
  group: noon-uae-register-branch
  cancel-in-progress: false

permissions:
  contents: read
  actions: write   # kept for optional manual escape-hatches; not used anymore

jobs:
  guard:
    # Exit cleanly if another run of this workflow is already in progress.
    # Covers manual Run-workflow clicks that bypass the Supabase trigger-gate.
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.g.outputs.proceed }}
    steps:
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          others=$(gh run list \
            --workflow noon-uae-register-branch.yml \
            --repo "$GITHUB_REPOSITORY" \
            --status in_progress \
            --limit 20 \
            --json databaseId \
            --jq "[.[] | select(.databaseId != ${{ github.run_id }})] | length")
          echo "Other in-progress runs: ${others:-0}"
          if [ "${others:-0}" -gt 0 ]; then
            echo "Another run is already in progress — exiting this one."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

  register:
    needs: guard
    if: needs.guard.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Register
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          JOB_INDEX: '0'
          JOB_COUNT: '1'
          SUMMARY_FILE: register-job.json
          CLAIM_SIZE: '5'
          DELAY_MS: '4000'
          CALL_BUDGET: '5'
          TIME_BUDGET_MIN: '5'
        run: node noon/uae/register-branch.js
      - name: Upload job summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: register-summary
          path: register-job.json
          if-no-files-found: warn
          retention-days: 7

  report:
    needs: [guard, register]
    if: always() && needs.guard.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/download-artifact@v4
        with:
          name: register-summary
          path: summaries
      - name: Build report
        run: node noon/uae/register-report.js summaries >> "$GITHUB_STEP_SUMMARY"
      - name: Reopen gate and request next dispatch (gated)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          # 1. Mark this dispatch log row completed (reopens the Supabase gate).
          curl -sf -X POST "$SUPABASE_URL/rest/v1/rpc/noon_registration_run_completed" \
                -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
                -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
                -H "Content-Type: application/json" -d '{}'

          # 2. Ask the SAME gated RPC the ranking-scrape trigger uses to dispatch
          #    the next machine. The RPC takes an advisory lock, re-checks the
          #    dispatch log, and only fires if nothing else just did. This replaces
          #    the previous `gh workflow run` self-dispatch, which bypassed the log
          #    and could race the ranking trigger's dispatch on the same tick.
          resp=$(curl -sf -X POST "$SUPABASE_URL/rest/v1/rpc/noon_registration_try_dispatch" \
                 -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
                 -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
                 -H "Content-Type: application/json" -d '{}')
          echo "noon_registration_try_dispatch -> ${resp:-no body}"
