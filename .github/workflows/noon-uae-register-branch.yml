name: Noon UAE – Register Branch

# Started by Supabase (noon_dispatch_registration trigger) when the ranking
# scrape finds outlet codes that are not in noon_branch. Can also be run by hand.
#
# Model: ONE machine operating at a time. The machine claims 5 outlets per batch
# (CLAIM_SIZE=5) and loops until the queue is empty or the time budget is spent.
# When the machine finishes, the report job calls noon_registration_run_completed
# which reopens the trigger-gate; if the queue still has items the report job
# dispatches a follow-up run.
on:
  workflow_dispatch:

concurrency:
  group: noon-uae-register-branch
  cancel-in-progress: false

permissions:
  contents: read
  actions: write   # lets the run re-dispatch itself when a backlog remains

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Register
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          JOB_INDEX: '0'
          JOB_COUNT: '1'
          SUMMARY_FILE: register-job.json
          CLAIM_SIZE: '5'
          DELAY_MS: '4000'
          CALL_BUDGET: '500'
          TIME_BUDGET_MIN: '40'
        run: node noon/uae/register-branch.js
      - name: Upload job summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: register-summary
          path: register-job.json
          if-no-files-found: warn
          retention-days: 7

  report:
    needs: [register]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/download-artifact@v4
        with:
          name: register-summary
          path: summaries
      - name: Build report
        run: node noon/uae/register-report.js summaries >> "$GITHUB_STEP_SUMMARY"
      - name: Mark workflow completed and start next if queue has items
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # 1. Reopen the trigger-gate: mark this dispatch log row completed
          curl -sf -X POST "$SUPABASE_URL/rest/v1/rpc/noon_registration_run_completed" \
                -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
                -H "Content-Type: application/json" -d '{}'
          # 2. If queue still has pending items, dispatch the next workflow
          n=$(curl -sf -X POST "$SUPABASE_URL/rest/v1/rpc/noon_registration_waiting" \
                -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
                -H "Content-Type: application/json" -d '{}')
          echo "Still waiting: ${n:-0}"
          if [ "${n:-0}" -gt 0 ]; then
            gh workflow run noon-uae-register-branch.yml --repo "$GITHUB_REPOSITORY" --ref main
            echo "Dispatched a follow-up run."
          fi
