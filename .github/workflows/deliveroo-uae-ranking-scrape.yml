name: Deliveroo UAE – Ranking Worker (started by Supabase)
run-name: Ranking run ${{ inputs.run_id }} · machine ${{ inputs.machine_no }}

# One worker machine. Supabase starts this workflow (one per machine) and controls it:
# which areas, when to send each request, planned breaks, pauses, slow-down/speed-up, and
# when to stop. The machine only fetches, saves and reports back. Do not start it by hand –
# use "Deliveroo UAE – Ranking Control" (Start) or the Supabase schedule.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Supabase run id (set by Supabase)'
        required: true
        type: string
      machine_no:
        description: 'Machine number within the run (set by Supabase)'
        required: true
        type: string
      update_images:
        description: 'Update deliveroo_branch_image_url when the card image changed'
        type: boolean
        default: true

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Machine ${{ inputs.machine_no }} of run ${{ inputs.run_id }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RUN_ID: ${{ inputs.run_id }}
          MACHINE_NO: ${{ inputs.machine_no }}
          UPDATE_IMAGES: ${{ inputs.update_images == false && 'false' || 'true' }}
          SUMMARY_FILE: summary-machine-${{ inputs.machine_no }}.json
        run: node --max-old-space-size=4096 deliveroo/uae/ranking-scrape.js
      - name: Machine report
        if: always()
        env:
          RUN_ID: ${{ inputs.run_id }}
          MACHINE_NO: ${{ inputs.machine_no }}
        run: |
          mkdir -p s && cp summary-machine-${{ inputs.machine_no }}.json s/ 2>/dev/null || true
          node deliveroo/uae/ranking-report.js s >> "$GITHUB_STEP_SUMMARY"
      - name: Upload machine summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ranking-run-${{ inputs.run_id }}-machine-${{ inputs.machine_no }}
          path: summary-machine-${{ inputs.machine_no }}.json
          if-no-files-found: warn
          retention-days: 7
