name: Menu Image Analysis – Run

# Started by Supabase (radar_image_dispatch) as soon as a restaurant is opened in the dashboard: three copies run
# side by side (shard 0, 1, 2), each scoring a third of the menu's images. They stop by themselves if the
# restaurant is closed. Results go straight back to Supabase; nothing is stored here.
# Logs only show counts (this repository is public).
on:
  workflow_dispatch:
    inputs:
      ticket:
        description: 'Menu request number'
        required: false
        default: '0'
      shard:
        description: 'Which third of the images (0, 1 or 2)'
        required: false
        default: '0'
      mode:
        description: 'menu (normal) or calib (score the owner-graded calibration photos)'
        required: false
        default: 'menu'

run-name: Menu images · ${{ inputs.mode == 'calib' && 'calibration' || format('request {0} · part {1}', inputs.ticket, inputs.shard) }}

permissions:
  contents: read
  packages: read

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container:
      image: ghcr.io/cnj-analytics/menu-image-analyzer:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # the analysis code comes from this branch, so scoring changes can be tried before the package is rebuilt
      - uses: actions/checkout@v4
      - name: Analyse menu images
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TICKET: ${{ inputs.ticket }}
          SHARD: ${{ inputs.shard }}
          SHARDS: '3'
          MODE: ${{ inputs.mode }}
          HOME: /root   # the models were cached under /root when the container was built
        run: python image-analysis/analyze.py
