name: Talabat UAE – Ranking Scrape (worker)

# One worker job. Dispatched by Supabase (talabat_ranking_dispatch_machine)
# from the Ranking Control run; may also be dispatched manually for debug.
# Each dispatch is one machine; machine_no is passed in.
#
# Multiple machines run as separate workflow_runs (one per dispatch call),
# which means each one gets a different GitHub-hosted runner IP.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'talabat_ranking_run.run_id'
        required: true
        type: string
      machine_no:
        description: 'talabat_ranking_run_machine.machine_no'
        required: true
        type: string
      page_size:
        description: 'composite-list page size'
        required: false
        type: string
        default: '1000'
      page_delay_ms:
        description: 'delay between page fetches within one area (ms)'
        required: false
        type: string
        default: '1500'

concurrency:
  group: talabat-uae-ranking-scrape-run-${{ inputs.run_id }}-m${{ inputs.machine_no }}
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 355   # GH hard cap is 360
    name: run ${{ inputs.run_id }} machine ${{ inputs.machine_no }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run ranking worker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RUN_ID:        ${{ inputs.run_id }}
          MACHINE_NO:    ${{ inputs.machine_no }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          PAGE_SIZE:     ${{ inputs.page_size }}
          PAGE_DELAY_MS: ${{ inputs.page_delay_ms }}
          WALL_LIMIT_SEC: '21000'
        run: node talabat/uae/ranking-scrape.js
