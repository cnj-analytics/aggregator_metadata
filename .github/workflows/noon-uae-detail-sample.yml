name: Noon UAE – Restaurant Page Sample

run-name: Noon detail sample · ${{ inputs.delay_ms }}ms

# ONE machine, ONE token, ~100 sampled branches.
#
# The food endpoints allow roughly 130 calls per runner IP (measured: changing
# the delay moved machine lifetime by 19% and total calls by 0.3%). The sample
# is 100 detail calls, so a single machine covers it with headroom and never
# needs replacing.
#
# A session minted at one point was proven to serve outlets in every zone, so
# there is no per-area locate here.

on:
  workflow_dispatch:
    inputs:
      delay_ms:
        description: 'Delay between detail calls (ms)'
        required: false
        type: string
        default: '1000'
      sample_limit:
        description: 'Max outlets to fetch this run'
        required: false
        type: string
        default: '200'
      call_budget:
        description: 'Stop after this many calls (IP budget guard)'
        required: false
        type: string
        default: '120'
      mint_source:
        description: 'Where the guest token is minted'
        required: false
        type: choice
        options: [worker, supabase]
        default: worker

permissions:
  contents: read

concurrency:
  group: noon-uae-detail-sample
  cancel-in-progress: false

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch restaurant pages
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DELAY_MS: ${{ inputs.delay_ms }}
          SAMPLE_LIMIT: ${{ inputs.sample_limit }}
          CALL_BUDGET: ${{ inputs.call_budget }}
          MINT_SOURCE: ${{ inputs.mint_source }}
        run: |
          set -euo pipefail
          node noon/uae/detail-sample.js 2>&1 | tee run.log

      - name: Summary
        if: always()
        env:
          DB: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set +e
          {
            echo '## Noon restaurant page sample'
            echo
            echo '### Coverage by stratum'
            echo '```'
            psql "$DB" -c "select sample_stratum, count(*) total, count(*) filter (where http_status=200) ok, count(*) filter (where http_status is not null and http_status<>200) failed from public.noon_restaurant_detail_sample group by 1 order by 1"
            echo '```'
            echo
            echo '### Brand / branch structure'
            echo '```'
            psql "$DB" -c "select brand_name, sampled_branches, distinct_brand_identifiers, distinct_menu_codes, distinct_oms_codes, distinct_phones, distinct_addresses, min_menu_items, max_menu_items from public.noon_detail_sample_brand_structure limit 50"
            echo '```'
            echo
            echo '### Field inventory (top 120 paths)'
            echo '```'
            psql "$DB" -c "select path, json_types, rows_with_field, fill_pct, distinct_values from public.noon_detail_sample_fields limit 120"
            echo '```'
            echo
            echo '### Last 30 log lines'
            echo '```'
            tail -30 run.log 2>/dev/null || echo '(no log)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noon-detail-sample-${{ github.run_id }}
          path: run.log
          if-no-files-found: warn
          retention-days: 14
