name: Deliveroo UAE – TEMP Iceberg Read Speed Test

# Temporary, READ-ONLY: times reading one restaurant straight from the Analytics Bucket
# (no Postgres connection, nothing written). Delete after the test.
on:
  workflow_dispatch:
    inputs:
      partners:
        description: 'Partner IDs, comma separated'
        type: string
        default: '7a9d56d6-ae58-4abf-b7ca-952049bc197f,f59b880d-be75-4739-8727-6ff0bde6b1f8,014db29e-06d6-4c9f-a941-d58cd465b772'
      one_day:
        description: 'Day for the single-day test (YYYY-MM-DD)'
        type: string
        default: '2026-09-26'

jobs:
  speedtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install --quiet "pyiceberg[pyarrow]==0.12.0" "duckdb==1.4.1"
      - name: Speed test
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_S3_ACCESS_KEY_ID: ${{ secrets.SUPABASE_S3_ACCESS_KEY_ID }}
          SUPABASE_S3_SECRET_ACCESS_KEY: ${{ secrets.SUPABASE_S3_SECRET_ACCESS_KEY }}
          SUPABASE_S3_REGION: ap-southeast-2
          ANALYTICS_BUCKET: deliveroo-ranking-archive
          PARTNERS: ${{ inputs.partners }}
          ONE_DAY: ${{ inputs.one_day }}
        run: python deliveroo/uae/ranking-read-speedtest.py
