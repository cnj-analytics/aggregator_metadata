name: Noon UAE – Ranking scrape

# PERSONAL-side runner. One dispatch = one machine = one GitHub-runner IP.
#
# This workflow checks out the ORG repo at runtime via the
# PERSONAL_READS_ORG_CODE secret, then runs noon/uae/ranking-scrape.js
# from THAT checkout. The ORG repo is the single source of truth — this
# workflow intentionally has no scraper code of its own. Any change to the
# scrape logic is pushed to the org repo and both personal & org dispatches
# pick it up on the next machine.
#
# Dispatched by Supabase function noon_ranking_dispatch_machine; the Supabase
# function alternates (or splits by machine_no) between the ORG and the
# PERSONAL repos so both drain the same shared queue in parallel. The
# worker code must behave identically in both places, which is why both
# workflows execute the exact same noon/uae/ranking-scrape.js from the org
# repo checkout.
#
# Required repo secrets (Settings -> Secrets -> Actions):
#   SUPABASE_URL
#   SUPABASE_SERVICE_ROLE_KEY
#   PERSONAL_READS_ORG_CODE  -- fine-grained PAT with read-only "Contents"
#                               access to the org repo. Owner: the ORG
#                               account.
#
# Required repo variable (Settings -> Variables -> Actions):
#   ORG_REPO                 -- "owner/name" of the org repo that holds
#                               the merged ranking-scrape.js, e.g.
#                               "cnj-alytics/aggregator-metadata-org".
#                               Set this BEFORE the first dual-dispatch run.

run-name: ranking run ${{ inputs.run_id }} m${{ inputs.machine_no }}

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'noon_ranking_run.id'
        required: true
        type: string
      machine_no:
        description: 'machine_no inside the run'
        required: true
        type: string
      page_delay_ms:
        description: 'overrides the per-page sleep (ms)'
        required: false
        type: string
      pin_area_id:
        description: 'optional: force this machine to only pick this area'
        required: false
        type: string

concurrency:
  group: noon-uae-ranking-${{ inputs.run_id }}-m${{ inputs.machine_no }}
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    name: scrape run ${{ inputs.run_id }} machine ${{ inputs.machine_no }}
    steps:
      # NOTE: We do NOT checkout this (personal) repo at all. The scraper
      # lives entirely in the org repo. This keeps a single source of truth
      # and avoids the risk of personal/org drift during an active run.
      - name: Checkout org repo (via PERSONAL_READS_ORG_CODE)
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.ORG_REPO }}
          token: ${{ secrets.PERSONAL_READS_ORG_CODE }}
          sparse-checkout: noon/uae
          path: org

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Ranking scrape (from org repo)
        working-directory: org/noon/uae
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RUN_ID: ${{ inputs.run_id }}
          MACHINE_NO: ${{ inputs.machine_no }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          WALL_LIMIT_SEC: '4000'
          RECOVERY_ATTEMPTS: '3'
          TOKEN_REFRESH_AT_MS: '240000'
          RECOVERY_BACKOFF_MS: '1500'
          OVERRIDE_PAGE_DELAY_MS: ${{ inputs.page_delay_ms }}
          OVERRIDE_PIN_AREA_ID: ${{ inputs.pin_area_id }}
        run: node ranking-scrape.js
