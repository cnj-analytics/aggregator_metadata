name: Careem UAE – Register Branches
run-name: Careem register – ${{ inputs.register_limit == '0' && 'ALL' || inputs.register_limit }} merchants × ${{ inputs.num_machines }} machine(s)

# Reads merchants from careem_restaurant_list_test, fetches each
# /v1/restaurants/{id}, and calls careem_register_merchant to populate
# the production tables (brand, branch, branch_information,
# branch_delivery_area, cuisines, registration queue).
#
# Default = 30-merchant test across 5 machines (6 per machine).
# For the full run later, set register_limit = 0.
#
# Live log: python -u + print(..., flush=True) means every merchant line
# shows up in the Actions UI immediately — no "wait for buffer" merging.

on:
  workflow_dispatch:
    inputs:
      num_machines:
        description: 'Parallel machines (1–5).'
        type: choice
        options: ['1', '2', '3', '4', '5']
        default: '5'
      register_limit:
        description: 'Total merchants to process across ALL machines (0 = no cap)'
        type: string
        default: '30'
      skip_registered:
        description: 'Skip merchants already in careem_branch (1 = yes, 0 = no)'
        type: choice
        options: ['1', '0']
        default: '1'
      delay_ms:
        description: 'ms between calls per machine'
        type: string
        default: '1500'
      retries:
        description: 'Retries per merchant on transient failure'
        type: string
        default: '3'

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        machine_no: [1, 2, 3, 4, 5]

    name: machine ${{ matrix.machine_no }}

    env:
      PYTHONUNBUFFERED: '1'

    steps:
      - name: Skip if machine_no > num_machines
        id: gate
        env:
          M: ${{ matrix.machine_no }}
          N: ${{ inputs.num_machines }}
        run: |
          if [ "$M" -le "$N" ]; then
            echo "active=true"  >> "$GITHUB_OUTPUT"
          else
            echo "active=false" >> "$GITHUB_OUTPUT"
            echo "Machine $M not needed (num_machines=$N) — exiting cleanly."
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.active == 'true'

      - name: Set up Python
        if: steps.gate.outputs.active == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install curl_cffi
        if: steps.gate.outputs.active == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'curl_cffi>=0.7,<1.0'

      - name: Register Careem branches
        if: steps.gate.outputs.active == 'true'
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MACHINE_NO:                ${{ matrix.machine_no }}
          NUM_MACHINES:              ${{ inputs.num_machines }}
          CAREEM_REGISTER_LIMIT:     ${{ inputs.register_limit }}
          CAREEM_SKIP_REGISTERED:    ${{ inputs.skip_registered }}
          CAREEM_DELAY_MS:           ${{ inputs.delay_ms }}
          CAREEM_RETRIES:            ${{ inputs.retries }}
        run: |
          set -euo pipefail
          # python -u + PYTHONUNBUFFERED keeps the stream live; no tee
          # on purpose, so GitHub streams each print as it happens.
          python -u careem/uae/register-branches.py
