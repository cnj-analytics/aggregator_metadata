name: Talabat UAE – Scrape All Areas (Full Sweep)

# Iterates every area in talabat_area and upserts every vendor into
# talabat_restaurant_queue with dedup/area_ids append via the RPC.
#
# Uses a matrix strategy to split the 497 areas across 3 parallel workers,
# each running on its own fresh ubuntu-latest VM (= its own IP). Talabat
# rate-limits per IP, so 3 workers at 1 req/sec each look like 3 independent
# clients from Talabat's perspective — no 429 risk.
#
# Expected runtime with 3 workers: ~35-45 min (vs 180+ min single-worker).
#
# Manual dispatch only.

on:
  workflow_dispatch:
    inputs:
      worker_count:
        description: 'Number of parallel workers (match the matrix size below)'
        required: true
        type: string
        default: '3'
      page_delay_ms:
        description: 'Delay between pages inside an area (ms)'
        required: false
        type: string
        default: '1100'
      area_delay_ms:
        description: 'Delay between areas (ms)'
        required: false
        type: string
        default: '2000'

concurrency:
  group: talabat-uae-scrape-all-areas
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        worker_index: [0, 1, 2]
    name: sweep-${{ matrix.worker_index }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Full UAE sweep (worker ${{ matrix.worker_index }}/${{ inputs.worker_count }})
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          WORKER_INDEX: ${{ matrix.worker_index }}
          WORKER_COUNT: ${{ inputs.worker_count }}
          PAGE_DELAY_MS: ${{ inputs.page_delay_ms }}
          AREA_DELAY_MS: ${{ inputs.area_delay_ms }}
        run: node talabat/uae/scrape-all-areas.js
