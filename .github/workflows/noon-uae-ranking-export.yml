name: Noon UAE – Ranking Export (daily)

# Copies finished hours of noon_ranking_analysis to the Analytics Bucket
# (deliveroo-ranking-archive, Iceberg table noon.ranking_analysis — shared bucket,
# Noon namespace keeps it separate from Deliveroo / Talabat / Careem) and records
# each verified hour in noon_ranking_export_log. noon_ranking_housekeeping (called by
# the hourly noon_ranking_run_begin) then drops hour partitions older than 24h that
# have a verified export.
#
# 05:00 Dubai = 01:00 UTC: inside the Noon scrape pause (last run 02:03, next 06:03
# Dubai) and one hour after the Deliveroo + Careem exports (00:00 UTC).

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (list the hours that would be exported; write nothing)'
        type: boolean
        default: false

concurrency:
  group: noon-uae-ranking-export
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install --quiet "pyiceberg[pyarrow]==0.12.0" "psycopg[binary]==3.3.6"
      - name: Export finished hours
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_S3_ACCESS_KEY_ID: ${{ secrets.SUPABASE_S3_ACCESS_KEY_ID }}
          SUPABASE_S3_SECRET_ACCESS_KEY: ${{ secrets.SUPABASE_S3_SECRET_ACCESS_KEY }}
          SUPABASE_S3_REGION: ap-southeast-2
          ANALYTICS_BUCKET: deliveroo-ranking-archive
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: python noon/uae/ranking-export.py
