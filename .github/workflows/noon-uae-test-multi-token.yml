name: Noon UAE – Test Multi-Token
run-name: Noon multi-token test – ${{ inputs.worker_count }} workers × ${{ inputs.requests_per_token }} requests

# Test: each worker runs on its own GitHub Actions runner (own IP),
# mints its own token from Supabase, and makes locate calls directly.
# On 403: mints fresh token and retries. If fresh token also 403s,
# IP is blocked and worker exits.
# Every single request is logged so you can watch live.

on:
  workflow_dispatch:
    inputs:
      worker_count:
        description: 'Number of workers (each gets its own machine/IP)'
        type: choice
        options: ['1', '2', '3', '4', '5']
        default: '3'
      requests_per_token:
        description: 'Max requests per worker (will stop early on IP block)'
        type: string
        default: '5500'
      delay_ms:
        description: 'Delay (ms) between requests per worker'
        type: string
        default: '100'

permissions:
  contents: read

concurrency:
  group: noon-uae-test-multi-token
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        worker_id: ${{ fromJson(
          inputs.worker_count == '1' && '[0]' ||
          inputs.worker_count == '2' && '[0,1]' ||
          inputs.worker_count == '3' && '[0,1,2]' ||
          inputs.worker_count == '4' && '[0,1,2,3]' ||
          inputs.worker_count == '5' && '[0,1,2,3,4]'
          ) }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run worker ${{ matrix.worker_id }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          WORKER_ID: ${{ matrix.worker_id }}
          REQUESTS_PER_TOKEN: ${{ inputs.requests_per_token }}
          DELAY_MS: ${{ inputs.delay_ms }}
        run: |
          set -euo pipefail
          echo "Worker ${{ matrix.worker_id }} — checking IP..."
          curl -s https://api.ipify.org && echo
          node noon/uae/test-multi-token.js 2>&1 | tee run.log

      - name: Build job summary
        if: always()
        run: |
          set +e
          {
            echo "## Worker ${{ matrix.worker_id }}"
            echo "Max requests: ${{ inputs.requests_per_token }} | Delay: ${{ inputs.delay_ms }}ms"
            echo
            IP=$(curl -s https://api.ipify.org 2>/dev/null || echo 'unknown')
            echo "Runner IP: $IP"
            echo
            echo '### Summary'
            echo '```'
            grep -E 'SUMMARY|worker [0-9]+:|total successes|tokens used|IP IS BLOCKED|FRESH TOKEN' run.log | tail -20
            echo '```'
            echo
            echo '### Last 50 lines'
            echo '```'
            tail -50 run.log 2>/dev/null || echo '(no log)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noon-multi-token-worker-${{ matrix.worker_id }}-${{ github.run_id }}
          path: run.log
          if-no-files-found: warn
          retention-days: 14
