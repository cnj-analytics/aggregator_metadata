name: Noon UAE – Test Multi-Token
run-name: Noon multi-token test – ${{ inputs.token_count }} tokens × ${{ inputs.requests_per_token }} requests

# Test script: mint N independent Noon sessions via Supabase, then run N
# workers in parallel — each worker uses its own token to make locate calls
# (set-location + whoami-food) directly from GitHub Actions' IP.
# Every single request is logged so you can watch live.
# Purpose: confirm multi-token independence and find the per-token limit.

on:
  workflow_dispatch:
    inputs:
      token_count:
        description: 'Number of tokens to mint'
        type: string
        default: '3'
      requests_per_token:
        description: 'Max requests per token (will stop early on 403)'
        type: string
        default: '5500'
      delay_ms:
        description: 'Delay (ms) between requests per worker'
        type: string
        default: '100'

permissions:
  contents: read

concurrency:
  group: noon-uae-test-multi-token
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run multi-token test
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TOKEN_COUNT: ${{ inputs.token_count }}
          REQUESTS_PER_TOKEN: ${{ inputs.requests_per_token }}
          DELAY_MS: ${{ inputs.delay_ms }}
        run: |
          set -euo pipefail
          node noon/uae/test-multi-token.js 2>&1 | tee run.log

      - name: Build job summary
        if: always()
        run: |
          set +e
          {
            echo "## Noon Multi-Token Test"
            echo "Tokens: ${{ inputs.token_count }} | Max requests/token: ${{ inputs.requests_per_token }} | Delay: ${{ inputs.delay_ms }}ms"
            echo
            echo '### Summary'
            echo '```'
            grep -E 'SUMMARY|worker [0-9]+:|total successes|confirmed' run.log | tail -20
            echo '```'
            echo
            echo '### Last 100 lines'
            echo '```'
            tail -100 run.log 2>/dev/null || echo '(no log)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noon-multi-token-test-${{ github.run_id }}
          path: run.log
          if-no-files-found: warn
          retention-days: 14
