name: Menu Image Analysis – Build

# Builds the ready-to-run container (libraries + all model weights baked in) and saves it to
# GitHub's container registry. Runs automatically when anything in image-analysis/ changes,
# or by hand from the Actions tab. Takes ~10-15 minutes; only needed when the analysis code changes.
on:
  push:
    branches: [main]
    paths: ['image-analysis/**', '.github/workflows/menu-image-build.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: image-analysis
          push: true
          tags: ghcr.io/cnj-analytics/menu-image-analyzer:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max